spring.data.mongodb.database=springmongodb
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# Knowledge graph import: judgments/reference files are read only from these
# official hosts (a host matches if it equals an entry or is a subdomain of it).
kg.import.allowed-hosts=gov.in,nic.in
kg.import.allow-http=false
kg.import.max-bytes=26214400
kg.import.connect-timeout-ms=15000
kg.import.read-timeout-ms=60000
kg.import.per-host-delay-ms=1000

# Bulk harvesting (old -> new, then incremental). Off by default; enable on the
# instances that should crawl. Several instances can run it safely.
kg.harvest.enabled=false
# Discovery: every 6 hours at :07, India time (sec min hour day month weekday)
kg.harvest.discovery-cron=0 7 */6 * * *
kg.harvest.worker-delay-ms=30000
kg.harvest.worker-batch=50
kg.harvest.max-attempts=6
kg.harvest.lease-seconds=900
kg.harvest.retry-base-seconds=300
kg.harvest.retry-max-seconds=43200
# Discovery and workers need separate scheduler threads.
spring.task.scheduling.pool.size=2
