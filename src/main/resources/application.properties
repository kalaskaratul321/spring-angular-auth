spring.data.mongodb.database=springmongodb
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

# Knowledge graph import: judgments/reference files are read only from these
# official hosts (a host matches if it equals an entry or is a subdomain of it).
kg.import.allowed-hosts=gov.in,nic.in
kg.import.allow-http=false
kg.import.max-bytes=26214400
kg.import.connect-timeout-ms=15000
kg.import.read-timeout-ms=60000
